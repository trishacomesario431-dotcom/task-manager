name: flutter_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  awesome_notifications: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/Logo_Image.png
    - assets/profile.png
    - assets/shang.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logo_Image.png"
  adaptive_icon_background: "#6A11CB"
  adaptive_icon_foreground: "assets/Logo_Image.png"